name: Build MFE

on:
  push:
    branches: [main]
    paths:
      - 'mfes/**'
      - 'docker/mfe/**'
      - 'brand-ficct'
      - 'brand-ficct/**'
      - '.github/workflows/build-mfe.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image name (lowercase)
        id: image
        run: echo "name=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/openedx-mfe" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Patch Dockerfile
        run: |
          # Reemplazar npm clean-install por npm install --legacy-peer-deps en todos los MFEs
          sed -i 's/npm clean-install/npm install --legacy-peer-deps/g' docker/mfe/Dockerfile

      - name: Resolve brand-ficct commit (cache-buster)
        id: brand
        run: echo "sha=$(git ls-remote https://github.com/LeonelBM123/brand-ficct.git refs/heads/master | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: docker/mfe
          build-contexts: |
            learning-src=mfes/frontend-app-learning
            authn-src=mfes/frontend-app-authn
            authoring-src=mfes/frontend-app-authoring
            catalog-src=mfes/frontend-app-catalog
            learner-dashboard-src=mfes/frontend-app-learner-dashboard
          build-args: |
            BRAND_FICCT_REF=${{ steps.brand.outputs.sha }}
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:21.0.0
            ${{ steps.image.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
